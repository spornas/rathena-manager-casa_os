version: "3.8"

services:
  # Serviço principal do emulador - CasaOS configurará este nome
  emulator:
    image: alpine:latest
    container_name: rathena-emulator
    restart: unless-stopped
    environment:
      - EMULATOR_TYPE=${EMULATOR_TYPE:-rathena}
      - INSTALL_PATH=${INSTALL_PATH:-/opt/rathena}
      - GIT_REPO=${GIT_REPO:-https://github.com/rathena/rathena}
      - GIT_BRANCH=${GIT_BRANCH:-master}
      - HTTP_PORT=${HTTP_PORT:-8081}
    volumes:
      - ${INSTALL_PATH}:/opt/rathena:rw
    ports:
      - "8081:8080"
    command: sh /start-emulator.sh
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Serviço de interface de configuração (Nginx)
  config:
    image: nginx:alpine
    container_name: rathena-config
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx-config:/etc/nginx/conf.d:ro
      - ./www:/usr/share/nginx/html:ro
      - ./start-emulator.sh:/start-emulator.sh:ro