server {
    listen 8080;
    server_name localhost;
    
    # Serve static HTML for configuration
    root /usr/share/nginx/html;
    index index.html;
    
    # API endpoint for emulator status
    location /api/status {
        default_type application/json;
        return 200 '{"status": "running", "emulator": "$EMULATOR_TYPE", "path": "$INSTALL_PATH"}';
    }
    
    # Serve static files
    location / {
        try_files $uri $uri/ /index.html;
    }
}